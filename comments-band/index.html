<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Comments Band</title>
  <meta name="description" content="The Comments Band turns viral videos' comment sections into songs. Every lyric is a real comment." />
  <link rel="canonical" href="https://bryanofearth.com/comments-band" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f14;
      --fg: #e6edf3;
      --dim: #98a4b3;
      --accent: #7ee787;
      --link: #79c0ff;
      --border: #1f2730;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f9fc;
        --fg: #0b1220;
        --dim: #475569;
        --accent: #16a34a;
        --link: #2563eb;
        --border: #e5e7eb;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100vh;
      line-height: 1.65;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 4rem;
    }
    h1 {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1.3;
      margin: 0 0 1.5rem;
    }
    .prompt {
      color: var(--accent);
      font-weight: 500;
    }
    p { margin: 0 0 1rem; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      color: var(--dim);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1><span class="prompt">$ </span>The Comments Band</h1>
    <p>The Comments Band is a YouTube, TikTok and Instagram channel that turns the comment sections of viral videos into songs. Every lyric is a real comment.</p>
    <p>Watch on YouTube: <a href="https://www.youtube.com/@thecommentsband">@thecommentsband</a></p>
    <p>Contact: <a href="mailto:weaverb9@gmail.com">weaverb9@gmail.com</a></p>
    <footer>
      <a href="/comments-band/privacy">Privacy policy</a> · <a href="/">← bryanofearth.com</a>
    </footer>
  </main>
</body>
</html>
